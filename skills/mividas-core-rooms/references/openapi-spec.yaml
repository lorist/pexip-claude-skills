openapi: 3.0.3
info:
  title: Mividas Core + Rooms
  version: 1.0.0
  description: 'API for Mividas Core + Rooms. Always include header `X-Mividas-Customer:
    <customerId>` if your user have access to multiple customers. See `GET /json-api/v1/customers/`.
    Use Basic Auth to authenticate.'
paths:
  /addressbook/:
    get:
      operationId: addressbook_list
      parameters:
      - in: header
        name: X-Mividas-Customer
        schema:
          type: integer
        description: Customer ID for current action (for use in multi-tenant installation)
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      tags:
      - addressbook
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAddressBookListList'
          description: ''
    post:
      operationId: addressbook_create
      parameters:
      - in: header
        name: X-Mividas-Customer
        schema:
          type: integer
        description: Customer ID for current action (for use in multi-tenant installation)
      tags:
      - addressbook
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddressBook'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AddressBook'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AddressBook'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressBook'
          description: ''
  /addressbook/{id}/:

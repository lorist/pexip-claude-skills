components:
  schemas:
    AcanoUser:
      type: object
      properties:
        id:
          type: string
          readOnly: true
        username:
          type: string
          maxLength: 200
        ldap_username:
          type: string
          maxLength: 100
        email:
          type: string
          maxLength: 200
        tenant:
          type: string
          readOnly: true
        organization_unit:
          type: string
          readOnly: true
        ts_created:
          type: string
          format: date-time
          readOnly: true
        last_synced:
          type: string
          format: date-time
          readOnly: true
      required:
      - email
      - id
      - last_synced
      - ldap_username
      - organization_unit
      - tenant
      - ts_created
      - username
    AccessMethod:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        call_leg_profile:
          type: string
          nullable: true
        lobby_profile:
          type: string
          nullable: true
        enabled:
          type: boolean
        title:
          type: string
          maxLength: 100
        provider_ref:
          type: string
          readOnly: true
          nullable: true
          title: ID in cluster
        always_create:
          type: boolean
          description: Even if no matching setting is made - e.g. setting moderator
            PIN, linking members etc.
        is_fallback:
          type: boolean
          title: Fallback setting
          description: For all extra addresses for selected member scope
        is_moderator:
          type: boolean
          readOnly: true
        is_default:
          type: boolean
          title: Is the default address for room
        system_id:
          nullable: true
          description: |-
            For backward compatibility with old rooms

            * `None` - None
            * `guest` - Guest
            * `moderator` - Moderator
          oneOf:
          - $ref: '#/components/schemas/SystemIdEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        member_scope:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MemberScopeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        override_api_settings:
          nullable: true
          title: Overrides for values ​​sent via API to MCU
          description: Not synced to template in CMS
        meeting_type:
          type: integer
        cluster:
          type: integer
          readOnly: true
        dial_in_security_profile:
          type: integer
          nullable: true
          description: Not synced to template in CMS
        message:
          type: integer
          readOnly: true
          nullable: true
        number_range:
          type: integer
          readOnly: true
          nullable: true
      required:
      - call_leg_profile
      - cluster
      - id
      - is_moderator
      - lobby_profile
      - meeting_type
      - message
      - number_range
      - provider_ref
      - title
    ActionEc7Enum:
      enum:
      - configuration
      - backup
      - commands
      - events
      - password
      - address_book
      - firmware
      - passive
      - room_controls
      - statistics
      - template
      - ca_certificates
      - dial_info
      - room_analytics
      - repeat
      type: string
      description: |-
        * `configuration` - configuration
        * `backup` - backup
        * `commands` - commands
        * `events` - events
        * `password` - password
        * `address_book` - address_book
        * `firmware` - firmware
        * `passive` - passive
        * `room_controls` - room_controls
        * `statistics` - statistics
        * `template` - template
        * `ca_certificates` - ca_certificates
        * `dial_info` - dial_info
        * `room_analytics` - room_analytics
        * `repeat` - repeat
    ActiveParticipant:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ts_created:
          type: string
          format: date-time
        cluster:
          type: integer
          nullable: true
        customer:
          type: integer
          nullable: true
        guid:
          type: string
          maxLength: 500
        name:
          type: string
          maxLength: 300
        is_gateway:
          type: boolean
      required:
      - guid
      - id
      - name
    ActiveTraceLog:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: string
          readOnly: true
        everything:
          type: boolean
        ts_start:
          type: string
          format: date-time
        ts_stop:
          type: string
          format: date-time
          nullable: true
        ts_created:
          type: string
          format: date-time
          readOnly: true
        cluster:
          type: integer
          nullable: true
        provider:
          type: integer
          nullable: true
        customer:
          type: integer
          nullable: true
        endpoint:
          type: integer
          nullable: true
      required:
      - id
      - ts_created
      - user
    AddDialout:
      type: object
      properties:
        enable:
          type: boolean
        dialstring:
          type: string
        persistant:
          type: boolean
      required:
      - dialstring
      - enable
      - persistant
    AddressBook:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: Name
          maxLength: 255
        type:
          allOf:
          - $ref: '#/components/schemas/Type231Enum'
          minimum: -32768
          maximum: 32767
        external_url:
          type: string
          title: URL
          maxLength: 200
        external_edit_url:
          type: string
          title: Editing URL
          maxLength: 200
        external_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ExternalTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        sources:
          type: array

    PolicyRule:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
          description: The primary key.
        hit_count:
          type: integer
          readOnly: true
        hit_count_long:
          type: integer
          readOnly: true
        enable:
          type: boolean
          title: Enable this rule
          description: Determines whether or not the rule is enabled. Any disabled
            rules still appear in the rules list but are ignored. Use this setting
            to test configuration changes, or to temporarily disable specific rules.
        is_fallback:
          type: boolean
          description: This is a fallback rule. These will always be placed last
        name:
          type: string
          description: The name used to refer to this Call Routing Rule.
          maxLength: 250
        tag:
          type: string
          title: Service tag
          description: A unique identifier used to track usage of this Call Routing
            Rule.
          maxLength: 250
        description:
          type: string
          description: A description of the Call Routing Rule.
          maxLength: 250
        priority:
          type: integer
          maximum: 2147483647
          minimum: -2147483648
          description: 'The priority of this rule. Rules are checked in ascending
            priority order until the first matching rule is found, and it is then
            applied. Range: 1 to 200.'
        match_incoming_calls:
          type: boolean
          title: Incoming gateway calls
          description: Applies this rule to incoming calls that have not been routed
            to a Virtual Meeting Room or Virtual Reception, and should be routed via
            the Pexip Distributed Gateway service.
        match_outgoing_calls:
          type: boolean
          title: Outgoing calls from a conference
          description: Applies this rule to outgoing calls placed from a conference
            service (e.g. when adding a participant to a Virtual Meeting Room) where
            Automatic routing has been selected.
        match_source_location:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: Calls being handled in location
          description: Applies the rule only if the incoming call is being handled
            by a Conferencing Node in the selected location or the outgoing call is
            being initiated from the selected location. To apply the rule regardless
            of the location, select Any Location.
        match_source_location_name:
          type: string
          readOnly: true
        match_source_alias:
          type: string
          maxLength: 250
        match_source_mode:
          $ref: '#/components/schemas/MatchSourceModeEnum'
        match_incoming_only_if_registered:
          type: boolean
          title: Match incoming calls from registered devices only
          description: Only apply this rule to incoming calls from devices, videoconferencing
            endpoints, soft clients or Infinity Connect clients that are registered
            to Pexip Infinity.  Note that the call must also match one of the selected
            protocols below. Calls placed from non-registered clients or devices,
            or from the Infinity Connect Web App will not be routed by this rule if
            it is enabled.
        match_incoming_webrtc:
          type: boolean
          title: Match Infinity Connect (WebRTC / RTMP)
          description: Select whether this rule should apply to incoming calls from
            Infinity Connect clients (WebRTC / RTMP).
        match_incoming_sip:
          type: boolean
          title: Match SIP
          description: Select whether this rule should apply to incoming SIP calls.
        match_incoming_mssip:
          type: boolean
          title: Match Lync / Skype for Business (MS-SIP)
          description: Select whether this rule should apply to incoming Lync / Skype
            for Business (MS-SIP) calls.
        match_incoming_h323:
          type: boolean
          title: Match H.323
          description: Select whether this rule should apply to incoming H.323 calls.
        match_string_full:
          type: boolean
          title: Match against full alias URI
          description: This setting is for advanced use cases and will not normally
            be required. By default, Pexip Infinity matches against a parsed version
            of the destination alias, i.e. it ignores the URI scheme, any other parameters,
            and any host IP addresses. So, if the original alias is "sip:alice@example.com;transport=tls"
            for example, then by default the rule will match against "alice@example.com".
            Select this option to match against the full, unparsed alias instead.
        match_string:
          type: string
          title: Destination alias regex match
          description: The regular expression that the destination alias (the alias
            that was dialed) is checked against to see if this rule applies to this
            call.
          maxLength: 250
        replace_string:
          type: string
          title: Destination alias regex replace string
          description: The regular expression string used to transform the originally
            dialed alias (if a match was found). Leave blank to leave the originally
            dialed alias unchanged.
          maxLength: 250
        call_type:
          allOf:
          - $ref: '#/components/schemas/PolicyRuleCallTypeEnum'
          title: Call capability
          description: |-
            Maximum media content of the call. The participant being called will not be able to escalate beyond the selected capability.

            * `audio` - Audio only
            * `video` - Main video + presentation
            * `video-only` - Main video only
            * `auto` - Same as incoming call
        max_callrate_in:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Maximum inbound call bandwidth (kbps)
          description: 'This optional field allows you to limit the bandwidth of media
            being received by Pexip Infinity from each individual participant dialed
            in via this Call Routing Rule. Range: 128 to 8192.'
        max_callrate_out:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          title: Maximum outbound call bandwidth (kbps)
          description: 'This optional field allows you to limit the bandwidth of media
            being sent by Pexip Infinity to each individual participant dialed out
            from this Call Routing Rule. Range: 128 to 8192.'
        max_pixels_per_second:
          nullable: true
          title: Maximum call quality
          description: |-
            Sets the maximum call quality for each participant.

            * `sd` - sd
            * `hd` - hd
            * `fullhd` - fullhd
          oneOf:
          - $ref: '#/components/schemas/MaxPixelsPerSecondEnum'
          - $ref: '#/components/schemas/NullEnum'
        crypto_mode:
          nullable: true
          title: Media encryption
          description: |-
            Controls the media encryption requirements for participants connecting to this service. Use global setting: Use the global media encryption setting (Platform > Global Settings). Required: All participants (including RTMP participants) must use media encryption. Best effort: Each participant will use media encryption if their device supports it, otherwise the connection will be unencrypted. No encryption: All H.323, SIP and MS-SIP participants must use unencrypted media. (RTMP participants will use encryption if their device supports it, otherwise the connection will be unencrypted.)

            * `besteffort` - besteffort
            * `on` - on
            * `off` - off
          oneOf:
          - $ref: '#/components/schemas/CryptoModeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        ivr_theme:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: Theme
          description: The theme for use with this service. If no theme is selected
            here, files from the theme that has been selected as the default (Platform
            > Global settings > Default theme) will be applied.
        called_device_type:
          allOf:
          - $ref: '#/components/schemas/CalledDeviceTypeEnum'
          title: Call target
          description: |-
            The device or system to which the call is routed. The options are: Registered device or external system: routes the call to a matching registered device if it is currently registered, otherwise attempts to route the call via an external system such as a SIP proxy, Lync / Skype for Business server, H.323 gatekeeper or other gateway/ITSP. Registered devices only: routes the call to a matching registered device only (providing it is currently registered). Lync / Skype for Business meeting direct (Conference ID in dialed alias): routes the call via a Lync / Skype for Business server to a Lync / Skype for Business meeting. Note that the destination alias must be transformed into just a Lync / Skype for Business Conference ID. Lync / Skype for Business clients, or meetings via a Virtual Reception: routes the call via a Lync / Skype for Business server either to a Lync / Skype for Business client, or - for calls that have come via a Virtual Reception - to a Lync / Skype for Business meeting. For Lync / Skype for Business meetings via Virtual Reception routing, ensure that Match against full alias URI is selected and that the Destination alias regex match ends with .*. Google Meet meeting: routes the call to a Google Meet meeting. Microsoft Teams meeting: routes the call to a Microsoft Teams meeting.

            * `external` - Registered device or external system
            * `registration` - Registered devices only
            * `mssip_conference_id` - Lync / Skype for Business meeting direct (Conference ID in dialed alias)
            * `mssip_server` - Lync / Skype for Business clients, or meetings via a Virtual Reception
            * `gms_conference` - Google Meet meeting
            * `teams_conference` - Microsoft Teams meeting
        outgoing_location:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: When calling an external system, this forces the outgoing call
            to be handled by a Conferencing Node in a specific location. When calling
            a Lync / Skype for Business meeting, a Conferencing Node in this location
            will handle the outgoing call, and - for 'Lync / Skype for Business meeting
            direct' targets - perform the Conference ID lookup on the Lync / Skype
            for Business server. Select Automatic to allow Pexip Infinity to automatically
            select which Conferencing Node to use.
        outgoing_protocol:
          allOf:
          - $ref: '#/components/schemas/OutgoingProtocolEnum'
          title: Protocol
          description: |-
            When calling an external system, this is the protocol to use when placing the outbound call. Note that if the call is to a registered device, Pexip Infinity will instead use the protocol that the device used to make the registration.

            * `h323` - h323
            * `mssip` - mssip
            * `sip` - sip
            * `rtmp` - rtmp
            * `gms` - gms
            * `teams` - teams
        sip_proxy:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: When calling an external system, this is the SIP proxy to use
            for outbound SIP calls. Select Use DNS to try to use normal SIP resolution
            procedures to route the call.
        teams_proxy:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: Teams Connector
          description: The Teams Connector to use for the Teams meeting. If you do
            not specify anything, the Teams Connector associated with the outgoing
            location is used.
        gms_access_token:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: Access token
          description: The access token to use when resolving Google Meet meeting
            codes.
        h323_gatekeeper:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: H.323 gatekeeper
          description: When calling an external system, this is the H.323 gatekeeper
            to use for outbound H.323 calls. Select Use DNS to try to use normal H.323
            resolution procedures to route the call.
        mssip_proxy:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          title: Lync / Skype for Business server
          description: When calling an external system, this is the Lync / Skype for
            Business server to use for outbound Lync / Skype for Business (MS-SIP)
            calls. Select Use DNS to try to use normal Lync / Skype for Business (MS-SIP)
            resolution procedures to route the call. When calling a Lync / Skype for
            Business meeting, this is the Lync / Skype for Business server to use
            for the Conference ID lookup and to place the call.
        stun_server:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: The STUN server to be used for outbound Lync / Skype for Business
            (MS-SIP) calls (where applicable).
        turn_server:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: The TURN server to be used for outbound Lync / Skype for Business
            (MS-SIP) calls (where applicable).
        external_participant_avatar_lookup:
          nullable: true
          description: |-
            Determines whether or not avatars for external participants will be retrieved using the method appropriate for the external meeting type. You can use this option to override the global configuration setting.

            * `default` - default
            * `yes` - yes
            * `no` - no
          oneOf:
          - $ref: '#/components/schemas/ExternalParticipantAvatarLookupEnum'
          - $ref: '#/components/schemas/NullEnum'
        treat_as_trusted:
          type: boolean
          description: This indicates the target of this routing rule will treat the
            caller as part of the target organization for trust purposes.
        external_id:
          type: integer
          readOnly: true
          nullable: true
        sync_back:
          type: boolean
          title: Sync back to Pexip
          description: This rule will be synced back to pexip.
        in_sync:
          type: boolean
          readOnly: true
          title: A sync
        last_external_sync:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cluster:
          type: integer
          readOnly: true
      required:
      - cluster
      - external_id
      - hit_count
      - hit_count_long
      - id
      - in_sync
      - last_external_sync

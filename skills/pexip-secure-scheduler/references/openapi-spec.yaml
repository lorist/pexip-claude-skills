          type: string
          title: Pinning configuration
          description: Select the pinning configuration you want to assign. The list
            of available options contains the names of all of the pinning configurations
            in the theme associated with this meeting.
          maxLength: 50
        participant_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Limit the number of participants able to join this meeting
        view:
          type: integer
          title: Layout
          description: The layout in the main VMR.
        breakout_rooms_mode:
          enum:
          - 'OFF'
          - MANUAL
          - AUTOMATIC
          type: string
          x-spec-enum-id: f39700d08617c13c
          description: |-

        end_date:
          type: string
          format: date
          nullable: true
        recurrence:
          type: string
          nullable: true
        main_language:
          type: integer
          nullable: true
          description: The main language spoken in the meeting.
        enable_chat:
          type: boolean
          default: true
          description: Enable chat in the VMR and breakout rooms.
        enable_overlay_text:
          type: boolean
          default: true
          description: Enable overlay text in the VMR and breakout rooms.
        guests_can_present:
          type: boolean
          default: true
          description: Allow guests to present in the main room.
        mute_all_guests:
          type: boolean
          default: false
          description: Mute all guests in the main room by default.
        theme:
          type: integer
          nullable: true
          description: The theme to use in the main room.
        breakout_room_theme:
          type: integer
          nullable: true
          description: The theme to use in the breakout rooms. If left blank the main
            theme will be used.
        pinning_config:
          type: string
          title: Pinning configuration
          description: Select the pinning configuration you want to assign. The list
            of available options contains the names of all of the pinning configurations
            in the theme associated with this meeting.
          maxLength: 50
        participant_limit:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Limit the number of participants able to join this meeting
        view:
          type: integer
          title: Layout
          description: The layout in the main VMR.
        breakout_rooms_mode:
          enum:
          - 'OFF'
          - MANUAL
          - AUTOMATIC
          type: string
          x-spec-enum-id: f39700d08617c13c
          description: |-
            Whether this meeting should use breakout rooms.

            * `OFF` - Off
            * `MANUAL` - Manual
            * `AUTOMATIC` - Automatic
        rtmp_streams:
          type: array
          items:
            type: integer
            title: RTMP streams
          description: RTMP streams that can be dialed from this encounter. At most
            5 can be selected.
        mail_sequence:
          type: integer
          maximum: 2147483647
          minimum: 0
          default: 0
          description: counter for the icalendar sequence field.
        encounter_aliases:
          type: array
          items:
            type: string
            minLength: 1
        encounter_participants:
          type: array
          items:
            $ref: '#/components/schemas/NestedEncounterParticipantRequest'
        breakout_rooms:
          type: array
          items:
            $ref: '#/components/schemas/NestedBreakoutRoomRequest'
        created_by:
          type: integer
          nullable: true
        access_groups:
          type: array
          items:
            type: integer
      required:
      - name
      - start_date
      - vmr

    PatchedEmailTemplateRequest:
      type: object
      description: Email Template Serializer.
      properties:
        id:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
          nullable: true
          readOnly: true
        subject_template:
          type: string
          default: Organization
          title: Email subject template
          description: Subject of the email.
          maxLength: 255
        body_template:
          type: string
          default: |-
            <!DOCTYPE html>
            <html>
                <head>
                    <style type="text/css">
                        table.joinTable {
                            border: none;
                            width: 520px;
                            text-align: left;
                            border-collapse: collapse;
                        }
                        table.joinTable td, table.joinTable th {
                            border: none;
                            padding: 10px 6px 10px 0px;
                        }
                        table.joinTable tfoot .links {
                            text-align: right;
                        }
                        table.joinTable tfoot .links a {
                            display: inline-block;
                            padding: 2px 8px;
                            border-radius: 5px;
                        }
                        td.listItem {
                            color: #777777;
                        }
                    </style>
                </head>
                <body>
                    <div>
                        <p><b>Dear {{ participant_display_name }},</b></p>
                        <p>The Organization is inviting you to a scheduled meeting. The meeting will take place online. You can find the joining details below.</p>
                        <div style="padding:1px 20px 15px;background-color:#f2f2f2;border-radius:5px;">
                            <h2><b>{{ encounter_name }}</b></h2>
                            <p>{{ encounter_start_date }} / {{encounter_start_time.strftime('%H:%M') }}-{{encounter_end_time.strftime('%H:%M') }} ({{ encounter_timezone }})</p>
                        </div>
                        <br>
                    </div>
                    <div class="container">
                        <h3>Here's how to join the meeting from:</h3>
                        <table class="joinTable">
                            <tbody>
                                {% for alias, alias_protocols in participant_aliases.items() %}
                                    {% if 'WEB' in alias_protocols %}
                                    <tr>
                                        <td class="listItem">Web (PC / Mac / iOS / Android):</td>
                                        <td>
                                            <a href="{{ default_webapp_url }}#/?conference={{ alias }}&name={{ participant_display_name }}&pin={{ participant_pin }}">
                                                Join meeting
                                            </a>
                                        </td>
                                    </tr>
                                    {% elif 'SIP' in alias_protocols %}
                                    <tr>
                                        <td class="listItem">From a video conferencing endpoint dial:</td>
                                        <td>sips:{{ alias }}</td>
                                    </tr>
                                    {% elif 'H323' in alias_protocols %}
                                    <tr>
                                        <td class="listItem">From a video conferencing endpoint dial:</td>
                                        <td>h323:{{ alias }}</td>
                                    </tr>
                                    {% endif %}
                                {% endfor %}
                                {% if participant_authentication_method == "PIN" %}
                                <tr>
                                    <td class="listItem">PIN code:</td>
                                    <td>{{ participant_pin }}</td>
                                </tr>
                                {% endif %}
                                {% if participant_authentication_method == "IDP" %}
                                <tr>
                                    <td class="listItem">Login:</td>
                                    <td>{{ participant_identity_provider }}</td>
                                </tr>
                                {% endif %}
                            </tbody>
                        </table>
                        <hr>
                        <p><b>Test your connection and equipment today.</b></p>
                        <p>Please test your connection, microphone, camera and speakers before the day of the meeting.
                        <table class="joinTable">
                            <tbody>
                                <tr>
                                    <td class="listItem">Web (PC / Mac / iOS / Android):</td>
                                    <td><a href="https://example.com/webapp3/#/?conference=test_call@example.com&name={{ participant_display_name }}">Test your connection now</a></td>
                                </tr>
                                <tr>
                                    <td class="listItem">From a video conferencing endpoint dial:</td>
                                    <td>sips:test_call@example.com</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </body>
            </html>
          title: Email body template
          description: Body of the email.
          maxLength: 24576

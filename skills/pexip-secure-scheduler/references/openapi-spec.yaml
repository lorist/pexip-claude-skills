openapi: 3.0.3
info:
  title: Portal API
  version: 5.1.0
  description: |
    The API is designed to facilitate the management of meetings, referred to as "encounters," within the portal.

    With this API, developers can create, update, retrieve, and delete various resources such as access groups, aliases, participants, encounters, breakout rooms, and more.

    Creating an initial encounter involves several steps:
    <ul>
        <li>Create Roles: Define the roles of the participants.</li>
        <li>Create Alias Templates: Define a template to generate dial aliases.</li>
        <li>Create Participants: Add participants to the system.</li>
        <li>Create Encounter: Create the encounter and associate participants with it.</li>
    </ul>
